services:
  compass:
    build: .
    image: compass:latest
    ports:
      - "8000:8000"
    volumes:
      - compass_history:/home/compass/.nis2_analyzer
      - ./reports:/app/reports
    environment:
      # Décommenter pour exiger une clé API sur les endpoints tenant-scoped
      # COMPASS_REQUIRE_API_KEY: "true"
      COMPASS_REQUIRE_API_KEY: "${COMPASS_REQUIRE_API_KEY:-}"

volumes:
  compass_history:
